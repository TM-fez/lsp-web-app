services:
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lsp
      POSTGRES_PASSWORD: lsp
      POSTGRES_DB: lsp_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data   # in-memory, wiped after test run
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsp -d lsp_test"]
      interval: 3s
      timeout: 3s
      retries: 10
