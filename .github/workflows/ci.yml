name: CI

on:
  push:
    branches: [main, develop]
  # No branch filter: stacked PRs (base = another feature branch) must run CI too.
  pull_request:

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint      --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lsp
          POSTGRES_PASSWORD: lsp
          POSTGRES_DB: lsp_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lsp:lsp@localhost:5433/lsp_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate test keys
        run: |
          mkdir -p apps/api/keys
          openssl genrsa -out apps/api/keys/private.pem 2048
          openssl rsa -in apps/api/keys/private.pem -pubout -out apps/api/keys/public.pem
      - name: Run migrations + seed
        working-directory: apps/api
        run: |
          npm run db:migrate
          npm run db:seed
        env:
          DATABASE_URL: postgresql://lsp:lsp@localhost:5433/lsp_test
          JWT_PRIVATE_KEY_PATH: ./keys/private.pem
          JWT_PUBLIC_KEY_PATH: ./keys/public.pem
          CORS_ORIGIN: http://localhost:5173
          BCRYPT_ROUNDS: '4'
      - name: Run tests
        working-directory: apps/api
        run: npm test
        env:
          DATABASE_URL: postgresql://lsp:lsp@localhost:5433/lsp_test
          JWT_PRIVATE_KEY_PATH: ./keys/private.pem
          JWT_PUBLIC_KEY_PATH: ./keys/public.pem
          CORS_ORIGIN: http://localhost:5173
          BCRYPT_ROUNDS: '4'
      # Live-DB suites (excluded from the default no-DB run). CI already has a migrated
      # Postgres, so run them here to gate real-data guarantees — including the channel
      # export filter that must never echo a Booking.com block back to the OTA.
      - name: Run live-DB tests (auth, dashboard, channel export)
        working-directory: apps/api
        run: npx vitest run --config vitest.live.config.ts
        env:
          DATABASE_URL: postgresql://lsp:lsp@localhost:5433/lsp_test
          JWT_PRIVATE_KEY_PATH: ./keys/private.pem
          JWT_PUBLIC_KEY_PATH: ./keys/public.pem
          CORS_ORIGIN: http://localhost:5173
          BCRYPT_ROUNDS: '4'
      # Cockpit e2e (12 tests) — designed for a fresh DB, which CI is on every run.
      - name: Run cockpit e2e tests
        working-directory: apps/api
        run: npx vitest run --config vitest.e2e.config.ts
        env:
          DATABASE_URL: postgresql://lsp:lsp@localhost:5433/lsp_test
          JWT_PRIVATE_KEY_PATH: ./keys/private.pem
          JWT_PUBLIC_KEY_PATH: ./keys/public.pem
          CORS_ORIGIN: http://localhost:5173
          BCRYPT_ROUNDS: '4'

  test-web:
    name: Web Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test --workspace=@lsp/web
