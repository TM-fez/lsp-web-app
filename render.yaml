# Render Blueprint — deploys the LSP engine (always-on Express API) + a Postgres database.
# The website stays on Vercel and proxies /api/* to this service (wired into
# apps/web/vercel.json once this is live), so the browser stays same-origin.
#
# The API runs with tsx (the same way it runs in dev) — no fragile build step. Migrations
# and the admin seed run on start (both idempotent: migrations skip what's applied, the
# admin seed is ON CONFLICT DO NOTHING).
services:
  - type: web
    name: lsp-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev
    startCommand: npm --prefix apps/api run db:migrate && npm --prefix apps/api run db:seed && npx tsx apps/api/src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lsp-db
          property: connectionString
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: JWT_REFRESH_COOKIE_NAME
        value: lsp_refresh
      - key: CORS_ORIGIN
        sync: false
      # Vercel rewrite → Render edge = 2 proxy hops. Makes req.ip the real client, so
      # per-IP rate limits + audit-log IPs stop lumping every user onto the proxy IP.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # Email (Brevo). API key is a secret → set its value in the Render dashboard.
      # The other two are not secret, so they apply automatically on deploy.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: info@fezeducation.co.bw
      - key: EMAIL_FROM_NAME
        value: Lifestyle Apartments

databases:
  - name: lsp-db
    plan: free
    databaseName: lsp
    user: lsp
