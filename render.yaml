# Render Blueprint — deploys the LSP engine (always-on Express API) + a Postgres database.
# The website stays on Vercel and proxies /api/* to this service (wired into
# apps/web/vercel.json once this is live), so the browser stays same-origin.
#
# The API runs with tsx (the same way it runs in dev) — no fragile build step. Migrations
# and the admin seed run on start (both idempotent: migrations skip what's applied, the
# admin seed is ON CONFLICT DO NOTHING).
services:
  - type: web
    name: lsp-api
    runtime: node
    # Paid: always-on (no sleeping), required for the Booking.com channel-sync cron.
    plan: starter
    buildCommand: npm install --include=dev
    startCommand: npm --prefix apps/api run db:migrate && npm --prefix apps/api run db:seed && npx tsx apps/api/src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lsp-db
          property: connectionString
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: JWT_REFRESH_COOKIE_NAME
        value: lsp_refresh
      - key: CORS_ORIGIN
        sync: false
      # Vercel rewrite → Render edge = 2 proxy hops. Makes req.ip the real client, so
      # per-IP rate limits + audit-log IPs stop lumping every user onto the proxy IP.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # File storage — Render's disk is EPHEMERAL (uploads die on every deploy), so
      # production must use an S3-compatible bucket (Cloudflare R2 / Backblaze B2).
      # Uncomment STORAGE_DRIVER + set the four secrets in the dashboard ONLY once the
      # bucket exists — with s3 selected and no credentials the API refuses to boot.
      # - key: STORAGE_DRIVER
      #   value: s3
      # - key: STORAGE_S3_BUCKET
      #   sync: false
      # - key: STORAGE_S3_REGION
      #   sync: false   # R2: "auto"
      # - key: STORAGE_S3_ACCESS_KEY
      #   sync: false
      # - key: STORAGE_S3_SECRET_KEY
      #   sync: false
      # - key: STORAGE_S3_ENDPOINT
      #   sync: false   # R2: https://<account-id>.r2.cloudflarestorage.com
      # Sentry error tracking — dark until the DSN is set in the dashboard.
      - key: SENTRY_DSN
        sync: false
      # Guest-facing links in emails (manage-my-booking) point at the public site.
      - key: PUBLIC_WEB_URL
        value: https://lsp-web-app-web.vercel.app
      # Email (Brevo). API key is a secret → set its value in the Render dashboard.
      # The other two are not secret, so they apply automatically on deploy.
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: info@fezeducation.co.bw
      - key: EMAIL_FROM_NAME
        value: Lifestyle Apartments
      # AI marketing & strategy (Claude). Dark until the key is set in the dashboard —
      # isLlmConfigured() is false without it, so guest segments still work and campaign/
      # strategy generation returns configured:false with no API call. Set the value
      # (a secret) in the Render dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: lsp-db
    # Paid (flexible plan): free Postgres expires and is deleted; basic-256mb keeps
    # the data with adjustable storage. Upgrade the instance in the dashboard too —
    # this line just keeps the blueprint from syncing it back down.
    plan: basic-256mb
    databaseName: lsp
    user: lsp
